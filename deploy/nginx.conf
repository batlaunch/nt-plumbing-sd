# Proposed nginx config for ntpplumbing.com (Coolify static site).
# NOT applied automatically — paste into Coolify → Application → Configuration →
# "Custom Nginx Configuration" (static build pack) after review.
#
# What changes vs. a standard SPA config:
#   - Prerendered routes are served from their own dist/<route>/index.html.
#   - Unknown paths return dist/404.html with a real HTTP 404 instead of the
#     homepage with HTTP 200 (the old `/index.html` catch-all is removed).
#   - Trailing-slash URLs 301 to the slashless canonical (/about/ -> /about).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers, so redirects keep https behind Coolify's proxy.
    absolute_redirect off;

    # /about/ -> /about (never the root "/")
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        # /services/leak-detection -> /services/leak-detection/index.html
        try_files $uri $uri/index.html =404;
    }

    # Vite's content-hashed bundles can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
